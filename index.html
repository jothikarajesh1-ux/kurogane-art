<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Atelier & Reference Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #f2f7f4;
      --pastel-green: #d8e8dd;
      --accent-sage: #8fbc8f;
      --dark-green: #1b4332;
      --deep-forest: #0d2818;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-dark: #1b4332;
      --text-muted: #52796f;
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Elegant Navigation Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(242, 247, 244, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      z-index: 1000;
      border-bottom: 1px solid rgba(27, 67, 50, 0.1);
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--dark-green);
    }

    nav { display: flex; gap: 2rem; align-items: center; }

    nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    nav a:hover { color: var(--accent-sage); }

    .btn-primary {
      background-color: var(--dark-green);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      border: none;
      font-family: var(--font-body);
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: var(--deep-forest);
      transform: translateY(-2px);
    }

    /* Hero Section with Elegant Typography */
    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 2rem;
      background: linear-gradient(180deg, var(--bg-light) 0%, var(--pastel-green) 100%);
    }

    .hero h1 {
      font-family: var(--font-heading);
      font-size: 4.5rem;
      font-weight: 400;
      color: var(--dark-green);
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin-bottom: 2.5rem;
      font-weight: 300;
    }

    /* Main Container & Gallery */
    .section-title {
      font-family: var(--font-heading);
      font-size: 2.8rem;
      text-align: center;
      color: var(--dark-green);
      margin: 4rem 0 2rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      padding: 0 4rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .art-card {
      background: var(--card-bg);
      border: 1px solid rgba(27, 67, 50, 0.08);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(13, 40, 24, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .art-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(13, 40, 24, 0.1);
    }

    .art-card img, .art-card video {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .card-info { padding: 1.5rem; }

    .card-info h3 {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      color: var(--dark-green);
      margin-bottom: 0.4rem;
    }

    .card-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 40, 24, 0.6);
      backdrop-filter: blur(6px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 550px;
      width: 90%;
      position: relative;
    }

    .modal-content h2 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      color: var(--dark-green);
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1.2rem; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--dark-green);
      margin-bottom: 0.4rem;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--pastel-green);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.9rem;
    }

    .close-btn {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      background: none; border: none;
      font-size: 1.5rem; color: var(--dark-green);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-logo">Atelier</div>
    <nav>
      <a href="#gallery">Gallery</a>
      <a href="#upload" onclick="openModal('upload-modal')">Upload</a>
      <a href="#queries" onclick="openModal('queries-modal')">Queries</a>
      <button class="btn-primary" onclick="openModal('auth-modal')">Sign In</button>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>Stylized Fashion & Art Collection</h1>
    <p>A tranquil gallery for anime-inspired outfit illustrations and community reference submissions.</p>
    <button class="btn-primary" onclick="openModal('upload-modal')">Submit Reference Photo</button>
  </section>

  <!-- Gallery -->
  <section id="gallery">
    <h2 class="section-title">Public Showcase</h2>
    <div class="gallery-grid">
      <div class="art-card">
        <img src="https://via.placeholder.com/400x300/d8e8dd/1b4332?text=Stylized+Illustration" alt="Art Reference">
        <div class="card-info">
          <h3>Casual Streetwear Study</h3>
          <p>Created from community reference. Soft green and forest tones.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Upload Modal -->
  <div class="modal" id="upload-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('upload-modal')">&times;</button>
      <h2>Upload Reference</h2>
      <form id="upload-form">
        <div class="form-group">
          <label>Photo or Video File ($\le 10$ mins)</label>
          <input type="file" id="media-input" accept="image/*,video/*" required>
        </div>
        <div class="form-group">
          <label>Outfit / Reference Notes</label>
          <textarea rows="3" placeholder="Describe the costume style or mood..."></textarea>
        </div>
        <div class="form-group" style="display:flex; gap:0.5rem; align-items:center;">
          <input type="checkbox" id="terms-check" required>
          <label for="terms-check" style="margin:0; font-size:0.8rem;">I agree to the Terms & Conditions (Public visibility & reference rights).</label>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Submit Reference</button>
      </form>
    </div>
  </div>

  <script>
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Video 10-min duration check
    document.getElementById('media-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.onloadedmetadata = function() {
          window.URL.revokeObjectURL(video.src);
          if (video.duration > 600) {
            alert('Videos must be 10 minutes or shorter.');
            e.target.value = '';
          }
        };
        video.src = URL.createObjectURL(file);
      }
    });
  </script>

</body>
</html>
